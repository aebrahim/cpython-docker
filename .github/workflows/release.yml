# Builds and publishes a release of the default branch's latest commit, every
# Monday morning or when run by hand (Actions > Release > Run workflow).
# Nobody pushes tags: a release's git tag is created when it's published.
# Every run does the same thing, so it's always safe to run again:
#
#   prepare  if the commit already has a published release, skip to
#            `promote`. Otherwise delete the draft releases of earlier
#            attempts that never published, and make a draft release for
#            this commit, named v<UTC date> (e.g. v2026.10.29), or
#            v2026.10.29-1, -2, ... if that day already has a release
#   plan     reads the CPython versions and platforms from docker-bake.hcl
#   build    one job per CPython version x platform, each on a native runner
#            (no QEMU): build with no cache, push by digest, test, SBOM
#   merge    one job per CPython version: combine the per-platform images
#            into one multi-arch image, tagged 3.14.10-<release>
#   release  fill the draft release with the SBOMs and publish it, which
#            creates the git tag
#   promote  move 3.14.10 and 3.14 to the published release's images
#
# Nothing is tagged in the registry until every platform of a version has
# built and passed its tests, and the tags that move only move once the
# release is published. The release is filled while it's a draft and only
# then published, as immutable releases require: publishing locks its tag
# and assets.
name: Release

on:
  schedule:
    - cron: "2 9 * * 1"
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions: {}

# One release at a time: a run never sees another's attempt in progress, so
# any draft release it finds is one that failed.
concurrency:
  group: release
  cancel-in-progress: false

env:
  SYFT_VERSION: v1.55.0

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.prepare.outputs.skip }}
      tag: ${{ steps.prepare.outputs.tag }}
      release: ${{ steps.prepare.outputs.release }}
      release_id: ${{ steps.prepare.outputs.release_id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the branch
        run: |
          default=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          if [ "$GITHUB_REF" != "refs/heads/${default}" ]; then
            echo "::error::releases are made from ${default}, not ${GITHUB_REF}"
            exit 1
          fi

      - name: Prepare the release
        id: prepare
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pattern='^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$'
          # Every release, newest first: "<id> <tag> <draft>".
          releases=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
                       --jq '.[] | "\(.id) \(.tag_name) \(.draft)"')

          # Already released? Every run releases the default branch's latest
          # commit, so only the newest published release can be at it.
          latest=
          while read -r id t draft; do
            if [ "$draft" = false ] && [[ $t =~ $pattern ]]; then latest=$t; break; fi
          done <<<"$releases"
          if [ -n "$latest" ] &&
             [ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${latest}" --jq .sha)" = "$GITHUB_SHA" ]; then
            echo "::notice::${GITHUB_SHA} is already released as ${latest}"
            {
              echo "skip=true"
              echo "tag=${latest}"
              echo "release=${latest#v}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Earlier attempts that never published. A draft has no git tag.
          while read -r id t draft; do
            if [ "$draft" = true ] && [[ $t =~ $pattern ]]; then
              echo "Deleting draft release ${t}, a failed attempt"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
            fi
          done <<<"$releases"

          # -1: no tag today yet; 0: only v<day>; n: v<day>-n is the highest.
          day=$(date -u +%Y.%m.%d)
          n=-1
          refs=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${day}" --jq '.[].ref')
          while read -r ref; do
            [ -n "$ref" ] || continue
            suffix=${ref#"refs/tags/v${day}"}
            if [ -z "$suffix" ]; then
              if [ "$n" -lt 0 ]; then n=0; fi
            elif [[ $suffix =~ ^-([0-9]+)$ ]]; then
              if [ "$((10#${BASH_REMATCH[1]}))" -gt "$n" ]; then n=$((10#${BASH_REMATCH[1]})); fi
            fi
          done <<<"$refs"
          if [ "$n" -lt 0 ]; then tag="v${day}"; else tag="v${day}-$((n + 1))"; fi

          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
                 -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="$tag" \
                 -F draft=true -f body="Being built by ${RUN_URL}" --jq .id)
          echo "Draft release ${tag} of ${GITHUB_SHA}"
          echo "Release \`${tag}\` of \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "skip=false"
            echo "tag=${tag}"
            echo "release=${tag#v}"
            echo "release_id=${id}"
          } >> "$GITHUB_OUTPUT"

  # Runs even when the commit is already released: `promote` needs it.
  plan:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      pythons: ${{ steps.plan.outputs.pythons }}
      matrix: ${{ steps.plan.outputs.matrix }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: bash .github/scripts/plan.sh >> "$GITHUB_OUTPUT"
      - id: image
        run: |
          # Registry names must be lowercase; owners often aren't.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare, plan]
    if: needs.prepare.outputs.skip == 'false'
    name: build ${{ matrix.version }} ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      IMAGE: ${{ needs.plan.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The release image is built from scratch: no-cache, and no cache
      # import of any kind. It's pushed by digest only; tags come later, in
      # `merge`, once every platform has passed its tests.
      - name: Build and push by digest (no cache)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: |
            PYTHON_VERSION=${{ matrix.version }}
            PYTHON_SHA256=${{ matrix.sha256 }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
            SOURCE_REVISION=${{ github.sha }}
          no-cache: true
          pull: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.title=python
            org.opencontainers.image.description=CPython ${{ matrix.version }} and its C libraries built from source on distroless
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # Runs the test stage on top of the image just built. The only cache it
      # can use is the layers produced by the step above, in this job, so it
      # tests exactly what was pushed.
      - name: Test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          platforms: ${{ matrix.platform }}
          build-args: |
            PYTHON_VERSION=${{ matrix.version }}
            PYTHON_SHA256=${{ matrix.sha256 }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
            SOURCE_REVISION=${{ github.sha }}
          outputs: type=cacheonly

      - id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      # +sbom-cataloger also reads the per-library SBOMs embedded in the
      # image (/usr/local/share/sbom), which carry each library's exact CPE.
      - name: SBOM
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          NAME: python-${{ matrix.version }}-${{ matrix.arch }}
        run: |
          mkdir -p sbom
          "$SYFT" scan "registry:${IMAGE}@${DIGEST}" --platform "$PLATFORM" \
            --select-catalogers +sbom-cataloger \
            -o "spdx-json=sbom/${NAME}.spdx.json" \
            -o "cyclonedx-json=sbom/${NAME}.cdx.json"

      - name: Record digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.minor }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.minor }}-${{ matrix.arch }}
          path: sbom/*
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: [prepare, plan, build]
    name: merge ${{ matrix.python.version }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.pythons) }}
    env:
      IMAGE: ${{ needs.plan.outputs.image }}
      RELEASE: ${{ needs.prepare.outputs.release }}
      VERSION: ${{ matrix.python.version }}
      MINOR: ${{ matrix.python.minor }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.python.minor }}-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the release's own tag, 3.14.10-<release> (e.g.
      # 3.14.10-2026.10.29). The tags that move, 3.14.10 and 3.14, are only
      # moved by `promote`, once the GitHub release is published.
      - name: Create multi-arch image and tag
        working-directory: digests
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${SOURCE}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            -t "${IMAGE}:${VERSION}-${RELEASE}" \
            "${sources[@]}"

      - name: Record the multi-arch digest
        run: |
          mkdir -p ../index
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}-${RELEASE}" \
                     --format '{{json .Manifest}}' | jq -r .digest)
          echo "${IMAGE}:${VERSION}-${RELEASE}@${digest}" > "../index/${MINOR}"
          docker buildx imagetools inspect "${IMAGE}@${digest}"
        working-directory: digests

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: index-${{ matrix.python.minor }}
          path: index/*
          if-no-files-found: error
          retention-days: 7

  # Collects every build's outputs and publishes them as one GitHub release.
  release:
    needs: [prepare, merge]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: index-*
          path: index
          merge-multiple: true

      - name: Assemble release assets and notes
        run: |
          cp vex/*.openvex.json dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          {
            echo "## Images"
            echo
            echo "Multi-arch (linux/amd64, linux/arm64). Pin by digest:"
            echo
            echo '```'
            cat index/*
            echo '```'
            echo
            echo "## Pinned components (shared by every image above)"
            echo
            echo "| Build arg | Value |"
            echo "|-----------|-------|"
            # shellcheck disable=SC2016  # the backticks are Markdown
            grep -E '^ARG [A-Z0-9_]+_(VERSION|DATE)=' Dockerfile \
              | grep -v '^ARG PYTHON_' \
              | sed -E 's/^ARG ([A-Z0-9_]+)=(.*)$/| `\1` | \2 |/'
            echo
            echo "## Assets"
            echo
            echo "- \`python-<version>-<arch>.spdx.json\` / \`.cdx.json\`: SBOM of each image, from Syft, including the per-library SBOMs embedded in the image."
            echo "- \`*.openvex.json\`: VEX statements for CVEs that don't apply to these builds; pass them to Grype with \`--vex\`."
            echo "- \`SHA256SUMS\`: checksums of the assets above."
          } > notes.md
          cat notes.md

      # Fill the draft `prepare` made, then publish it: an immutable release
      # can't gain assets after it's published. Publishing creates the git
      # tag, at the commit this run built. Re-running this job replaces the
      # draft's assets.
      - name: Publish release
        run: |
          api="repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          if [ "$(gh api "$api" --jq .draft)" != true ]; then
            echo "::error::release ${TAG} is already published"
            exit 1
          fi
          gh api -X PATCH "$api" -F body=@notes.md > /dev/null
          gh release upload "$TAG" dist/* --clobber
          immutable=$(gh api -X PATCH "$api" -F draft=false -f make_latest=true --jq .immutable)

          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::tag ${TAG} is at ${sha}, not ${GITHUB_SHA}"
            exit 1
          fi
          if [ "$immutable" = false ]; then
            echo "::warning::${TAG} isn't immutable; turn on release immutability in the repository's settings"
          fi

  # Points the tags that move (3.14.10 and 3.14) at the published release's
  # images. Also runs when the commit was already released, so tags left
  # behind by a failure here are fixed by the next run.
  promote:
    needs: [prepare, plan, release]
    if: >-
      always()
      && needs.prepare.result == 'success'
      && needs.plan.result == 'success'
      && (needs.release.result == 'success' || needs.prepare.outputs.skip == 'true')
    name: promote ${{ matrix.python.version }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.pythons) }}
    env:
      IMAGE: ${{ needs.plan.outputs.image }}
      RELEASE: ${{ needs.prepare.outputs.release }}
      VERSION: ${{ matrix.python.version }}
      MINOR: ${{ matrix.python.minor }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # With a single multi-arch source and no annotations, imagetools
      # copies the index as is, so the moved tags get the same digest; the
      # loop checks that.
      - name: Move the tags
        run: |
          digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest
          }
          src=$(digest "${IMAGE}:${VERSION}-${RELEASE}")
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" -t "${IMAGE}:${MINOR}" "${IMAGE}@${src}"
          for tag in "$VERSION" "$MINOR"; do
            got=$(digest "${IMAGE}:${tag}")
            if [ "$got" != "$src" ]; then
              echo "::error::${IMAGE}:${tag} is ${got}, not ${src}"
              exit 1
            fi
            echo "${IMAGE}:${tag} -> ${IMAGE}:${VERSION}-${RELEASE}@${src}"
          done
