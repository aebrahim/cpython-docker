# Cuts a release every Monday morning (Los Angeles time), or by hand, if the
# default branch has changed since the last release tag.
#
# The tag is named after today's date in Los Angeles: v2026.11.23. If that tag
# already exists, -1, -2, ... is appended (v2026.11.23-1).
#
# A tag created with GITHUB_TOKEN doesn't trigger other workflows, so the
# Release workflow's `push: tags` never fires for it. Instead, the `release`
# job below calls release.yml directly with the new tag, so each tag gets
# exactly one release run, and no App or personal token is needed.
name: Weekly release

on:
  schedule:
    - cron: "1 9 * * 1"
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      force:
        description: Release even if nothing changed since the last release
        type: boolean
        default: false

permissions: {}

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the tag
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      FORCE: ${{ inputs.force || false }}
    steps:
      - name: Check the branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::releases are cut from $DEFAULT_BRANCH only, not $REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Check for changes since the last release
        id: changes
        run: |
          if last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null); then
            count=$(git rev-list --count "${last}..HEAD")
            echo "Last release: $last ($count commits since)"
          else
            last=""
            count=1
            echo "No earlier release"
          fi
          if [ "$count" -eq 0 ] && [ "$FORCE" != "true" ]; then
            echo "Nothing changed since $last; not releasing."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # Creating the ref through the API fails if it already exists, so the
      # first free name wins even if two runs race.
      - name: Create the tag
        id: tag
        if: steps.changes.outputs.release == 'true'
        run: |
          base="v$(TZ=America/Los_Angeles date +%Y.%m.%d)"
          for n in $(seq 0 99); do
            tag=$base
            [ "$n" -gt 0 ] && tag="$base-$n"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists"
              continue
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/refs" \
                 -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null; then
              echo "Created $tag at $GITHUB_SHA"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Couldn't create $tag; trying the next name"
          done
          echo "::error::no free tag name for $base"
          exit 1

  release:
    needs: tag
    if: needs.tag.outputs.tag
    # A called workflow's jobs can't have more permissions than this.
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
